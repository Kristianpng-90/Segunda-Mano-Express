      <div class="meta2"><span>🚚 ${ship}</span>${as === "seller" ? `<span data-cy="datos-comprador">👤 ${esc(o.ship.name)} · 📞 ${esc(o.ship.phone)}</span>` : ""}${o.ship.notes ? `<span>📝 ${esc(o.ship.notes)}</span>` : ""}</div>
      ${o.payment ? `<div class="meta2"><span data-cy="pago-pedido">💳 ${payText(o.payment)}</span></div>` : lastTry && o.status === "pendiente" ? `<div class="meta2"><span style="color:var(--danger)">Último intento de pago rechazado ${ago(lastTry.at)}.</span></div>` : ""}
      ${o.status === "cancelado" ? `<span class="small">Cancelado ${o.cancelAt ? ago(o.cancelAt) : ""}${o.cancelReason ? `. Motivo: “${esc(o.cancelReason)}”` : ""}</span>` : ""}
      ${acts ? `<div class="rowactions">${acts}</div>` : ""}</article>`;
  }
  function wireOrders(done) {
    const after = (r, ok) => { toast(r.error || ok); done(); header(); };
    $$("[data-ocancel]").forEach((b) => b.addEventListener("click", async () => { b.disabled = true; after(await shopCall("status", Number(b.dataset.ocancel), { action: "cancelar" }), "Pedido cancelado. No se hizo ningún cobro."); }));
    $$("[data-orecv]").forEach((b) => b.addEventListener("click", () => {
      const o = db.orders.find((x) => x.id === Number(b.dataset.orecv));
      modal(`<div style="display:grid;gap:12px" data-cy="confirmar-recibido"><h2>¿Ya recibiste el pedido ${esc(o.code)}?</h2><p>Confirma solo si ya tienes el artículo y está como se describía. El pedido queda <b>Completado</b> y podrás calificar a ${esc(user(o.seller).name)}.</p>
        <div class="actions"><button class="btn" id="do-recv" data-cy="confirmar-recibo">Sí, lo recibí</button><button class="btn ghost" data-close>Todavía no</button></div></div>`, (s, close) => {
        $("#do-recv", s).addEventListener("click", async () => { $("#do-recv", s).disabled = true; const r = await shopCall("status", o.id, { action: "completar" }); close(); after(r, "¡Listo! Pedido completado. Ya puedes calificar la compra."); });
      });
    }));
    $$("[data-oproc]").forEach((b) => b.addEventListener("click", () => {
      const o = db.orders.find((x) => x.id === Number(b.dataset.oproc));
      modal(`<form id="oproc" class="form" novalidate data-cy="form-en-proceso"><h2>Pedido ${esc(o.code)} en proceso</h2><p class="muted small">Le avisamos a ${esc(user(o.buyer).name)} que ya lo estás preparando o que lo enviaste.</p>
        <div class="field"><label for="op-n">Nota para quien compra (opcional)</label><input id="op-n" name="note" maxlength="150" placeholder="${o.ship.method === "domicilio" ? "Ej.: Enviado por Servientrega, guía 123456" : "Ej.: Te lo entrego el sábado en Suba"}" data-cy="nota-proceso"><span class="err"></span></div>
        <div class="actions"><button class="btn" data-cy="confirmar-en-proceso">Marcar En proceso</button><button type="button" class="btn ghost" data-close>Cancelar</button></div></form>`, (s, close) => {
        $("#oproc", s).addEventListener("submit", async (e) => { e.preventDefault(); const r = await shopCall("status", o.id, { action: "procesar", note: $("#op-n", s).value.trim() }); close(); after(r, "Pedido en proceso. Le avisamos a quien compró."); });
      });
    }));
    $$("[data-orefund]").forEach((b) => b.addEventListener("click", () => {
      const o = db.orders.find((x) => x.id === Number(b.dataset.orefund));
      modal(`<form id="oref" class="form" novalidate data-cy="form-cancelar-venta"><h2>Cancelar el pedido ${esc(o.code)}</h2><p class="muted small">Las unidades vuelven a tu publicación y ${o.payment && o.payment.provider === "pruebas" ? "el pago se reversa" : "debes anular el pago desde el panel de Wompi"}.</p>
        <div class="field"><label for="or-r">Motivo</label><textarea id="or-r" name="reason" maxlength="200" placeholder="Ej.: El artículo se dañó y no lo puedo entregar" data-cy="motivo-cancelar-venta"></textarea><span class="err"></span></div>
        <div class="actions"><button class="btn danger" data-cy="confirmar-cancelar-venta">Cancelar pedido</button><button type="button" class="btn ghost" data-close>Volver</button></div></form>`, (s, close) => {
        const f = $("#oref", s);
        f.addEventListener("submit", async (e) => {
          e.preventDefault();
          const reason = f.reason.value.trim();
          if (!setErr(f, "reason", reason.length < 5 ? "Escribe el motivo (mínimo 5 caracteres)." : "")) return;
          const r = await shopCall("status", o.id, { action: "cancelar", note: reason }); close(); after(r, "Pedido cancelado. Le avisamos a quien compró.");
        });
      });
    }));
    $$("[data-orate]").forEach((b) => b.addEventListener("click", () => rateModal(db.txs.find((t) => t.id === Number(b.dataset.orate)), done)));
  }
  function viewMisPedidos() {
    if (!me()) return needLogin("mis-pedidos");
    if (me().admin) return denied("La cuenta de administración no hace compras.");
    const u = me(), list = db.orders.filter((o) => o.buyer === u.id).sort((a, b) => b.at - a.at);
    const paid = list.filter((o) => ["pagado", "en_proceso", "completado"].includes(o.status));
    main().innerHTML = `<div class="wrap page medium">
      <div class="pagehead"><div><h1>Mis pedidos</h1><p class="muted" data-cy="pedidos-resumen">${list.length} ${list.length === 1 ? "pedido" : "pedidos"} · ${money(paid.reduce((a, o) => a + o.total, 0))} pagados · Estados: Pendiente → Pagado → En proceso → Completado.</p></div><a class="btn ghost" href="#carrito">🛒 Ver carrito</a></div>
      <div class="list">${list.length ? list.map((o) => orderCard(o, "buyer")).join("") : `<div class="empty" data-cy="sin-pedidos"><h3>Aún no tienes pedidos</h3><p class="muted">Compra un artículo con “Comprar ahora” o desde tu carrito.</p><a class="btn ghost" href="#catalogo">Ir al catálogo</a></div>`}</div></div>`;
    wireOrders(viewMisPedidos);
  }
  function viewMisVentas() {
    if (!me()) return needLogin("mis-ventas");
    if (me().admin) return denied("La cuenta de administración no vende artículos.");
    const u = me(), list = db.orders.filter((o) => o.seller === u.id).sort((a, b) => b.at - a.at);
    const paid = list.filter((o) => ["pagado", "en_proceso", "completado"].includes(o.status));
    const todo = list.filter((o) => o.status === "pagado").length;
    main().innerHTML = `<div class="wrap page medium">
      <div class="pagehead"><div><h1>Mis ventas</h1><p class="muted" data-cy="ventas-resumen">${paid.length} ${paid.length === 1 ? "venta pagada" : "ventas pagadas"} · ${money(paid.reduce((a, o) => a + o.total, 0))} · ${todo} por preparar.</p></div><a class="btn ghost" href="#mis-publicaciones">Mis publicaciones</a></div>
      <div class="list">${list.length ? list.map((o) => orderCard(o, "seller")).join("") : `<div class="empty" data-cy="sin-ventas"><h3>Aún no tienes ventas</h3><p class="muted">Cuando alguien pague uno de tus artículos, aparece aquí y te avisamos.</p></div>`}</div></div>`;
    wireOrders(viewMisVentas);
  }

  /* =====================================================================
   * Contraseñas y "Continuar con Google" (Google Identity Services)
   * ===================================================================== */
  function passInput(id, name, ac, cy) {
    return `<span class="passwrap"><input id="${id}" name="${name}" type="password" autocomplete="${ac}" maxlength="64" data-cy="${cy}"><button type="button" data-eye="${id}" aria-label="Mostrar contraseña" data-cy="${cy}-ver">👁</button></span>`;
  }
  function passRules(pass, email) {
    const err = window.SME_CORE.passwordError(pass, String(email || "").trim().toLowerCase());
    const r = [[pass.length >= 8, "8 o más caracteres"], [/[a-zA-ZñÑáéíóúÁÉÍÓÚ]/.test(pass) && /\d/.test(pass), "letras y números"], [pass.length >= 8 && !err, "difícil de adivinar"]];
    return r.map(([ok, t]) => `<span class="${ok ? "on" : ""}">${ok ? "✓" : "○"} ${t}</span>`).join("");
  }
  const googleOn = () => serverMode && !!CONFIG.googleClientId;
  function googleBlock(kind) {
    if (!googleOn()) return "";
    return `<div style="display:grid;gap:12px"><div id="g-alert"></div><div class="gsi" id="gsi-${kind}" data-cy="google-${kind}"></div><div class="divider">o con tu correo</div></div>`;
  }
  let gisLoading = null, gisReady = false, gisHandler = null;
  function loadGis() {
    if (gisLoading) return gisLoading;
    gisLoading = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = "https://accounts.google.com/gsi/client"; s.async = true;
      s.onload = resolve; s.onerror = () => { gisLoading = null; reject(new Error("No pudimos cargar el acceso con Google. Revisa tu conexión.")); };
      document.head.appendChild(s);
    });
    return gisLoading;
  }
  async function googleButton(el, text, onCredential) {
    if (!el) return;
    try { await loadGis(); } catch (e) { el.innerHTML = `<p class="small muted">${esc(e.message)}</p>`; return; }
    gisHandler = onCredential;
    if (!gisReady) {
      window.google.accounts.id.initialize({ client_id: CONFIG.googleClientId, callback: (r) => gisHandler && gisHandler(r.credential), auto_select: false, cancel_on_tap_outside: true, ux_mode: "popup" });
      gisReady = true;
    }
    window.google.accounts.id.renderButton(el, { theme: "outline", size: "large", text, shape: "pill", logo_alignment: "left", width: Math.max(220, Math.min(380, el.clientWidth || 320)), locale: "es" });
  }
  function authAlert(msg) {
    const box = $("#g-alert");
    if (box) { box.innerHTML = `<div class="alert bad" data-cy="google-error" role="alert">${esc(msg)}</div>`; box.scrollIntoView({ block: "center" }); }
    else toast(msg);
  }
  async function googleLogin(cred) {
    let r;
    try { r = await api("auth/google", { credential: cred }); } catch (e) { return authAlert(e.message); }
    if (r.needsProfile) return googleProfileModal(r);
    setSession(r.uid, r.token); await refreshState();
    const u = me();
    if (!u) return authAlert("No pudimos abrir tu cuenta. Intenta de nuevo.");
    afterAuth(u, r.linked ? `Vinculamos tu cuenta de Google. Hola, ${u.name.split(" ")[0]}.` : `Hola, ${u.name.split(" ")[0]}.`);
  }
  function wireGoogle(kind) { if (googleOn()) googleButton($(`#gsi-${kind}`), kind === "reg" ? "signup_with" : "continue_with", googleLogin); }
  function googleProfileModal(g) {
    let picked = "";
    modal(`<form id="gp" class="form" novalidate data-cy="google-completar"><h2>Completa tu registro</h2>
      <p class="muted small">Cuenta de Google verificada: <b>${esc(g.name)}</b> · ${esc(g.email)}</p>
      <div class="field"><label for="gp-city">Ciudad o municipio</label><select id="gp-city" name="city" data-cy="google-ciudad"><option value="">Selecciona…</option>${CITIES.map((c) => `<option>${c}</option>`).join("")}</select><span class="err"></span></div>
      <div class="field"><span class="lbl">Elige tu rol para empezar</span><div class="roles"><input type="hidden" name="role">
        ${["C", "V", "D"].map((k) => `<button type="button" class="rolecard" data-grole="${k}" data-cy="google-rol-${k}"><b>${{ C: "🛒", V: "🏷️", D: "🎁" }[k]} ${ROLES[k]}</b><span class="small muted">${ROLE_DESC[k]}</span></button>`).join("")}</div><span class="err"></span></div>
      <div id="gp-alert"></div>
      <div class="actions"><button class="btn" data-cy="google-crear">Crear mi cuenta</button><button type="button" class="btn ghost" data-close>Cancelar</button></div></form>`, (s, close) => {
      const f = $("#gp", s);
      $$("[data-grole]", f).forEach((b) => b.addEventListener("click", () => { picked = b.dataset.grole; f.role.value = picked; $$("[data-grole]", f).forEach((x) => x.classList.toggle("on", x === b)); setErr(f, "role", ""); }));
      f.addEventListener("submit", async (e) => {
        e.preventDefault();
        let r;
        try { r = await api("auth/google/complete", { ticket: g.ticket, role: picked, city: f.city.value }); }
        catch (err) { $("#gp-alert", s).innerHTML = `<div class="alert bad">${esc(err.message)}</div>`; return; }
        ["city", "role"].forEach((k) => setErr(f, k, (r.errors || {})[k] || ""));
        if (r.errors) return;
        setSession(r.uid, r.token); mergeState(r, true); close();
        const u = me();
        afterAuth(u, `Bienvenido, ${u.name.split(" ")[0]}. Creamos tu cuenta con Google. Modo activo: ${ROLES[u.role]}.`);
      });
    });
  }

  /* ---------- chat: fotos y ubicación ---------- */
  function msgBody(c, m) {
    if (m.type === "image") return `<a class="msgimg" href="${esc(m.url)}" target="_blank" rel="noopener" data-cy="mensaje-imagen"><img src="${esc(m.url)}" alt="Foto enviada por ${esc(firstName(m.from))}" loading="lazy"></a>`;
    if (m.type === "location") {
      const lat = Number(m.lat), lng = Number(m.lng), d = 0.004;
      const src = `https://www.openstreetmap.org/export/embed.html?bbox=${(lng - d).toFixed(6)}%2C${(lat - d * 0.7).toFixed(6)}%2C${(lng + d).toFixed(6)}%2C${(lat + d * 0.7).toFixed(6)}&layer=mapnik&marker=${lat}%2C${lng}`;
      return `<div class="msgloc" data-cy="mensaje-ubicacion"><iframe title="Mapa con la ubicación de ${esc(firstName(m.from))}" src="${src}" loading="lazy" referrerpolicy="no-referrer"></iframe>
        <span>📍 Ubicación de ${esc(firstName(m.from))}${m.acc ? ` · precisión ±${esc(m.acc)} m` : ""}</span>
        <a href="https://www.google.com/maps/search/?api=1&query=${lat}%2C${lng}" target="_blank" rel="noopener" data-cy="abrir-mapa">Abrir en Google Maps ↗</a></div>`;
    }
    return esc(showMsg(c, m));
  }

  /* ---------- enrutador por hash (#nombre) ---------- */
  function render() {
    const h = (location.hash || "#catalogo").slice(1);
    const u = me();
    if (u && u.suspended) { setSession(null); toast("Esta cuenta está suspendida por moderación."); }
    header();
    const nav = $("#topnav"); nav.classList.remove("open"); $("#menu-btn").setAttribute("aria-expanded", "false");
    window.scrollTo(0, 0);
    renderView(h);
    main().focus({ preventScroll: true });
  }
  function renderView(h) {
    let m;
    if ((m = h.match(/^editar-(\d+)$/))) return viewPublicar(Number(m[1]));
    if ((m = h.match(/^pub-(\d+)$/))) return viewPost(Number(m[1]));
    if ((m = h.match(/^chat-(\d+)$/))) return viewChat(Number(m[1]));
    if ((m = h.match(/^perfil-(\d+)$/))) return viewPerfil(Number(m[1]));
    if ((m = h.match(/^pago-(\d+)$/))) return viewPago(Number(m[1]));
    if ((m = h.match(/^compra-(\d+)$/))) return viewCompra(Number(m[1]));
    const views = {
      catalogo: viewCatalogo, registro: viewRegistro, login: viewLogin, publicar: viewPublicar, pedir: viewPedir,
      "mis-publicaciones": viewMisPublicaciones, "mis-solicitudes": viewMisSolicitudes, transacciones: viewTransacciones,
      mensajes: viewMensajes, notificaciones: viewNotificaciones, admin: viewAdmin,
      entregas: viewEntregas, favoritos: viewFavoritos, recuperar: viewRecuperar,
      carrito: viewCarrito, checkout: viewCheckout, "mis-pedidos": viewMisPedidos, "mis-ventas": viewMisVentas,
    };
    (views[h] || viewCatalogo)();
  }
  /* Actualiza la pantalla cuando llegan cambios de otras personas, sin borrar lo que se está escribiendo */
  const LIVE = /^(catalogo|pub-\d+|chat-\d+|perfil-\d+|mensajes|notificaciones|mis-publicaciones|mis-solicitudes|transacciones|entregas|favoritos|admin|carrito|mis-pedidos|mis-ventas|compra-\d+)$/;
  function liveRefresh(how) {
    if (me() && me().suspended) return render();
    header();
    const h = (location.hash || "#catalogo").slice(1);
    if (document.querySelector(".scrim")) return;
    if (how !== "replace" && !LIVE.test(h)) return;
    const a = document.activeElement;
    const cy = a && a.closest && a.closest("#main") && a.dataset ? a.dataset.cy : null;
    const val = cy && "value" in a ? a.value : null, y = window.scrollY;
    renderView(h);
    window.scrollTo(0, y);
    if (cy) { const el = document.querySelector(`#main [data-cy="${cy}"]`); if (el) { if (val !== null && "value" in el) el.value = val; el.focus({ preventScroll: true }); } }
  }

  /* ---------- reiniciar datos de demostración ---------- */
  function wireReset() {
    $("#reset").addEventListener("click", () => {
      if (serverMode && !(me() && me().admin)) return toast("En el modo compartido solo el administrador puede restablecer los datos de todos.");
      modal(`<h2>¿Restablecer los datos de demostración?</h2><p class="muted">Se borran las cuentas, publicaciones y mensajes creados${serverMode ? " por todos los usuarios" : " en este navegador"} y vuelven los datos de ejemplo.</p>
        <div class="actions"><button class="btn danger" id="do-reset" data-cy="confirmar-reset">Restablecer</button><button class="btn ghost" data-close>Cancelar</button></div>`, (s, close) => {
        $("#do-reset", s).addEventListener("click", async () => {
          if (serverMode) {
            try { const r = await api("demo-reset", {}); setSession(null); mergeState(r); }
            catch (e) { close(); return toast(e.message); }
          } else { db = seed(); setSession(null); save(); }
          close(); toast("Datos de demostración restablecidos."); go("catalogo"); render();
        });
      });
    });
  }

  // Al corregir un campo con error, el mensaje desaparece
  const clearFieldErr = (e) => { const f = e.target.closest && e.target.closest(".field.bad"); if (f) { f.classList.remove("bad"); const er = f.querySelector(".err"); if (er) er.textContent = ""; } };
  document.addEventListener("input", clearFieldErr);
  document.addEventListener("change", clearFieldErr);
  window.addEventListener("hashchange", render);
  // Mostrar u ocultar la contraseña
  document.addEventListener("click", (e) => {
    const b = e.target.closest && e.target.closest("[data-eye]"); if (!b) return;
    const i = document.getElementById(b.dataset.eye); const show = i.type === "password";
    i.type = show ? "text" : "password"; b.textContent = show ? "🙈" : "👁"; b.setAttribute("aria-label", show ? "Ocultar contraseña" : "Mostrar contraseña");
  });
  window.addEventListener("storage", (e) => { if (!serverMode && (e.key === KEY || e.key === SKEY)) { db = loadLocal(); try { sess = JSON.parse(localStorage.getItem(SKEY)) || {}; } catch (x) { sess = {}; } render(); } });

  /* ---------- menú del celular e instalación como app ---------- */
  function wireMenu() {
    const b = $("#menu-btn"), nav = $("#topnav");
    b.addEventListener("click", () => { const open = nav.classList.toggle("open"); b.setAttribute("aria-expanded", String(open)); b.textContent = open ? "✕" : "☰"; });
    nav.addEventListener("click", (e) => { if (e.target.closest("a")) { nav.classList.remove("open"); b.textContent = "☰"; } });
  }
  function wireInstall() {
    let deferred = null;
    const btn = $("#install");
    window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferred = e; btn.hidden = false; });
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.navigator.standalone;
    if (ios && serverMode) btn.hidden = false;
    btn.addEventListener("click", async () => {
      if (deferred) { deferred.prompt(); await deferred.userChoice; deferred = null; btn.hidden = true; return; }
      modal(`<div style="display:grid;gap:10px"><h2>Instalar en el iPhone</h2><p>En Safari toca el botón <b>Compartir</b> (cuadro con flecha hacia arriba) y luego <b>“Agregar a pantalla de inicio”</b>.</p><button class="btn" data-close>Entendido</button></div>`);
    });
    window.addEventListener("appinstalled", () => { btn.hidden = true; toast("SegundaMano Express quedó instalada."); });
    if ("serviceWorker" in navigator && serverMode) navigator.serviceWorker.register("sw.js").catch(() => {});
  }

  async function boot() {
    if (/^https?:$/.test(location.protocol)) {
      try { const r = await api("state"); if (r && r.state) { serverMode = true; mergeState(r); if (r.auth === false) { setSession(null); toast("Tu sesión venció. Inicia sesión de nuevo."); } } } catch (e) { /* sin servidor: modo local */ }
      if (serverMode) {
        try { CONFIG = Object.assign(CONFIG, await api("config")); } catch (e) { /* sin configuración: valores por defecto */ }
        if (sess.token) api("session", {}).catch((e) => { if (e.status === 401) { setSession(null); render(); } });
      }
    }
    if (!serverMode) save();
    if (sess.uid && (!user(sess.uid) || (serverMode && !sess.token))) setSession(null);
    setConnected(serverMode);
    wireReset(); wireMenu(); wireInstall();
    render();
    if (serverMode) {
      setInterval(poll, 2500);
      document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
      window.addEventListener("online", poll);
    }
  }
  boot();
})();

</script>

</body></html>
