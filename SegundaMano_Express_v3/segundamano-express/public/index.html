<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>SegundaMano Express</title>
<meta name="theme-color" content="#1E2B22">
<meta name="description" content="Compra, vende o regala artículos de segunda mano y coordina la entrega por chat.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SegundaMano">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: header de marca + franja de filtros + cuadrícula de tarjetas; vistas internas en una columna de lectura.
   Identidad del Sprint 1 (Trello): verde bosque, ocre y fondos arena; Fraunces para títulos y Work Sans para texto. */
:root {
  --bg: #F3EEE4;
  --surface: #FBF8F2;
  --surface-2: #ECE5D7;
  --line: #DCD3C2;
  --fg: #1E2B22;
  --fg-soft: #56635A;
  --brand: #1E2B22;
  --brand-fg: #F3EEE4;
  --venta: #2E6B47;
  --venta-bg: #DDEBDF;
  --dona: #8A5A12;
  --dona-bg: #F3E2C4;
  --accent: #C98A2C;
  --danger: #A63D2F;
  --danger-bg: #F5DCD6;
  --focus: #C98A2C;
  --shadow: 0 1px 2px rgba(30, 43, 34, .06), 0 6px 18px rgba(30, 43, 34, .06);
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "Work Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141B16; --surface: #1C251F; --surface-2: #243029; --line: #34433A;
    --fg: #ECE6DA; --fg-soft: #A9B3A8; --brand: #0E1410; --brand-fg: #ECE6DA;
    --venta: #8FD1A6; --venta-bg: #1F3A2A; --dona: #E9B565; --dona-bg: #3A2C15;
    --accent: #E0A447; --danger: #F0907F; --danger-bg: #3E201B; --focus: #E0A447;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141B16; --surface: #1C251F; --surface-2: #243029; --line: #34433A;
  --fg: #ECE6DA; --fg-soft: #A9B3A8; --brand: #0E1410; --brand-fg: #ECE6DA;
  --venta: #8FD1A6; --venta-bg: #1F3A2A; --dona: #E9B565; --dona-bg: #3A2C15;
  --accent: #E0A447; --danger: #F0907F; --danger-bg: #3E201B; --focus: #E0A447;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--brand); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(1.7rem, 4vw, 2.4rem); }
h2 { font-size: 1.45rem; }
h3 { font-size: 1.1rem; }
p { margin: 0; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.wrap {
  max-width: 1160px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.muted { color: var(--fg-soft); }
.small { font-size: .85rem; }
.num { font-variant-numeric: tabular-nums; }

/* Header */
.topbar { background: var(--brand); color: var(--brand-fg); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.topbar .wrap { display: flex; align-items: center; gap: 14px; padding-block: 10px; flex-wrap: wrap; }
.logo { display: flex; align-items: baseline; gap: 6px; text-decoration: none; color: var(--brand-fg); margin-right: auto; }
.logo b { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; letter-spacing: -.01em; }
.logo span { font-size: .72rem; text-transform: uppercase; letter-spacing: .14em; color: var(--accent); font-weight: 600; }
.nav { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.nav a, .nav button.link {
  text-decoration: none; padding: 7px 10px; border-radius: 8px; font-size: .92rem;
  background: none; border: 0; cursor: pointer; color: var(--brand-fg);
}
.nav a:hover, .nav button.link:hover { background: rgba(255,255,255,.08); }
.nav a.on { background: rgba(255,255,255,.12); font-weight: 600; }
.bell { position: relative; }
.bell .count {
  position: absolute; top: 0; right: 0; transform: translate(30%, -20%);
  background: var(--accent); color: #1E2B22; font-size: .7rem; font-weight: 700;
  min-width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; padding: 0 4px;
}
.rolesel { display: flex; align-items: center; gap: 6px; font-size: .8rem; }
.rolesel select { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.25); color: var(--brand-fg); border-radius: 8px; padding: 5px 8px; }
.rolesel select option { color: #1E2B22; background: #FBF8F2; }

/* Buttons and forms */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid transparent; border-radius: 10px; padding: 10px 16px; cursor: pointer;
  font-weight: 600; text-decoration: none; background: var(--fg); color: var(--bg);
}
.btn:hover { filter: brightness(1.1); }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.btn.accent { background: var(--accent); color: #1E2B22; }
.btn.danger { background: var(--danger); color: var(--surface); }
.btn.sm { padding: 6px 11px; font-size: .85rem; border-radius: 8px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label, .lbl { font-weight: 600; font-size: .88rem; }
.field input, .field select, .field textarea, .input {
  width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface);
}
.field textarea { min-height: 96px; resize: vertical; }
.field .err { color: var(--danger); font-size: .82rem; min-height: 0; }
.field.bad input, .field.bad select, .field.bad textarea { border-color: var(--danger); }
.form { display: grid; gap: 16px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.hint { font-size: .82rem; color: var(--fg-soft); }

/* Panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; }
.page { padding-block: 28px 56px; display: grid; gap: 22px; }
.narrow { max-width: 560px; margin: 0 auto; width: 100%; }
.medium { max-width: 820px; margin: 0 auto; width: 100%; }
.pagehead { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.alert { border-radius: 10px; padding: 12px 14px; font-size: .92rem; background: var(--surface-2); }
.alert.bad { background: var(--danger-bg); color: var(--danger); }
.alert.ok { background: var(--venta-bg); color: var(--venta); }

/* Hero + filters */
.hero { background: var(--brand); color: var(--brand-fg); }
.hero .wrap { padding-block: 26px 30px; display: grid; gap: 18px; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); align-items: end; }
.hero h1 { color: var(--brand-fg); font-size: clamp(1.8rem, 4.4vw, 2.7rem); }
.hero h1 em { font-style: italic; color: var(--accent); }
.hero p { color: #C9D2C7; max-width: 52ch; margin-top: 8px; }
.stats { display: grid; grid-template-columns: repeat(2, auto); gap: 14px 28px; justify-content: end; }
.auth-side .stats { justify-content: start; }
.stats div { display: grid; }
.stats b { font-family: var(--font-display); font-size: 1.6rem; color: var(--accent); font-variant-numeric: tabular-nums; }
.stats span { font-size: .78rem; color: #C9D2C7; }
@media (max-width: 720px) { .hero .wrap { grid-template-columns: 1fr; } .stats { justify-content: flex-start; } }

.filters { display: grid; gap: 12px; padding-block: 18px 6px; }
.searchrow { display: flex; gap: 10px; flex-wrap: wrap; }
.searchrow .input { flex: 1 1 260px; min-width: 0; }
.searchrow select { flex: 0 1 200px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 9px 14px; cursor: pointer; font-weight: 500; }
.seg button.on { background: var(--fg); color: var(--bg); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 13px; cursor: pointer; font-size: .88rem; }
.chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.resultbar { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }

/* Cards */
.cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
@media (max-width: 880px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.badge.solicitud { background: #DCE4EE; color: #2F4E73; }
:root[data-theme="dark"] .badge.solicitud { background: #22324A; color: #A9C4E6; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .badge.solicitud { background: #22324A; color: #A9C4E6; } }
.price.need { color: #2F4E73; font-size: 1.05rem; }
.card.req { border-style: dashed; border-width: 2px; border-color: #9DB2CC; }
.summary { display: grid; gap: 6px; border-left: 4px solid var(--accent); }
.summary a { font-weight: 600; }
.auth { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 22px; align-items: stretch; max-width: 980px; margin: 0 auto; width: 100%; }
.auth-side { background: var(--brand); color: var(--brand-fg); border-radius: var(--radius); padding: 28px; display: grid; gap: 16px; align-content: center; }
.auth-side h2 { color: var(--brand-fg); }
.auth-side h2 em { color: var(--accent); }
.auth-side p, .auth-side li { color: #C9D2C7; }
.auth-side ul { margin: 0; padding-left: 18px; display: grid; gap: 8px; }
.auth .panel { margin: 0; }
@media (max-width: 880px) { .auth { grid-template-columns: 1fr; } .auth-side { display: none; } }
.contactbox { font-size: .8rem; padding: 8px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; background: var(--surface-2); }
.msg.sys { align-self: center; background: var(--surface-2); font-size: .82rem; text-align: center; }
.btn.locked { opacity: .55; cursor: not-allowed; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; text-decoration: none; color: inherit; transition: transform .15s ease, box-shadow .15s ease; }
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.thumb { aspect-ratio: 4 / 3; width: 100%; max-width: 100%; display: grid; place-items: center; font-size: 3.2rem; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.card .body { padding: 12px 14px 14px; display: grid; gap: 6px; }
.card h3 { font-size: 1.02rem; font-family: var(--font-body); font-weight: 600; }
.price { font-family: var(--font-display); font-size: 1.25rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.price.free { color: var(--dona); }
.meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .82rem; color: var(--fg-soft); }
.badge { display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; border-radius: 6px; padding: 3px 8px; }
.badge.venta { background: var(--venta-bg); color: var(--venta); }
.badge.donacion { background: var(--dona-bg); color: var(--dona); }
.badge.gray { background: var(--surface-2); color: var(--fg-soft); }
.badge.bad { background: var(--danger-bg); color: var(--danger); }
.empty { text-align: center; padding: 48px 16px; border: 1px dashed var(--line); border-radius: var(--radius); display: grid; gap: 8px; justify-items: center; }

/* Detail */
.detail { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 26px; align-items: start; }
@media (max-width: 800px) { .detail { grid-template-columns: 1fr; } }
.detail .thumb { border-radius: var(--radius); font-size: 6rem; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: .92rem; }
.facts dt { color: var(--fg-soft); }
.facts dd { margin: 0; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.seller { display: flex; align-items: center; gap: 12px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--surface-2); flex: none; }
.stars { color: var(--accent); letter-spacing: 1px; }

/* Q&A, chat, lists */
.qa { display: grid; gap: 14px; }
.q { border-bottom: 1px solid var(--line); padding-bottom: 12px; display: grid; gap: 6px; }
.q .a { padding-left: 14px; border-left: 2px solid var(--line); color: var(--fg-soft); }
.list { display: grid; gap: 10px; }
.row { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.row .grow { flex: 1 1 240px; min-width: 0; display: grid; gap: 3px; }
.row .mini { width: 56px; height: 56px; border-radius: 10px; font-size: 1.7rem; flex: none; aspect-ratio: auto; }
.row.unread { border-left: 4px solid var(--accent); }
.chatbox { display: grid; grid-template-rows: auto minmax(260px, 50vh) auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.chathead { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.msgs { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; background: var(--bg); }
.msg { max-width: 78%; padding: 8px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.msg.me { align-self: flex-end; background: var(--venta-bg); border-color: transparent; }
.msg small { display: block; font-size: .72rem; color: var(--fg-soft); margin-top: 2px; }
.composer { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
.composer input { flex: 1; min-width: 0; }
.starpick { display: flex; gap: 4px; }
.starpick button { background: none; border: 0; font-size: 1.8rem; cursor: pointer; color: var(--line); padding: 0 2px; line-height: 1; }
.starpick button.on { color: var(--accent); }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th, td { text-align: left; padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-soft); }
.roles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.rolecard { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px; cursor: pointer; display: grid; gap: 4px; text-align: left; }
.rolecard.on { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); background: var(--surface-2); }
.rolecard b { font-family: var(--font-display); font-size: 1.05rem; }
.demo { font-size: .85rem; display: grid; gap: 4px; }
.demo code { font-size: .82rem; background: var(--surface-2); padding: 1px 6px; border-radius: 5px; }

/* Modal + toast */
.scrim { position: fixed; inset: 0; background: rgba(20, 27, 22, .55); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { background: var(--surface); border-radius: 14px; padding: 22px; width: min(480px, 100%); display: grid; gap: 14px; max-height: 90vh; overflow-y: auto; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 60; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
footer { border-top: 1px solid var(--line); }
footer .wrap { padding-block: 18px 28px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; font-size: .82rem; color: var(--fg-soft); }

/* ---------- Sprint 3: favoritos, entregas, fotos, celular ---------- */
.cardwrap { position: relative; display: flex; }
.cardwrap .card { flex: 1; min-width: 0; }
.fav { position: absolute; top: 8px; right: 8px; width: 38px; height: 38px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center; font-size: 1.15rem; background: rgba(251,248,242,.92); box-shadow: var(--shadow); color: #A63D2F; line-height: 1; }
.fav.on { background: #A63D2F; color: #fff; }
.fav.big { position: static; width: auto; height: auto; border-radius: 10px; padding: 10px 16px; font-size: .95rem; font-weight: 600; gap: 6px; display: inline-flex; border: 1px solid var(--line); background: var(--surface); color: var(--fg); box-shadow: none; }
.fav.big.on { background: var(--danger-bg); color: var(--danger); border-color: transparent; }
.navfav .count, .navbadge { background: var(--accent); color: #1E2B22; font-size: .7rem; font-weight: 700; border-radius: 9px; padding: 1px 6px; margin-left: 4px; }
.gallery { display: grid; gap: 10px; }
.gallery .thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.gallery .thumbs button { width: 64px; height: 64px; border-radius: 10px; overflow: hidden; padding: 0; border: 2px solid transparent; cursor: pointer; background: var(--surface-2); }
.gallery .thumbs button.on { border-color: var(--accent); }
.gallery .thumbs img { width: 100%; height: 100%; object-fit: cover; }
.photopick { display: grid; gap: 10px; }
.photopick .btns { display: flex; gap: 10px; flex-wrap: wrap; }
.photopick .btns label { cursor: pointer; }
.photopick input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.photos { display: flex; gap: 10px; flex-wrap: wrap; }
.photos .ph { position: relative; width: 96px; height: 96px; border-radius: 10px; overflow: hidden; background: var(--surface-2); }
.photos .ph img { width: 100%; height: 100%; object-fit: cover; }
.photos .ph button { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: rgba(20,27,22,.75); color: #fff; cursor: pointer; line-height: 1; }
.photos .ph .cover { position: absolute; left: 4px; bottom: 4px; font-size: .65rem; font-weight: 700; background: var(--accent); color: #1E2B22; padding: 1px 6px; border-radius: 5px; }
.delivery { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 10px; background: var(--surface); }
.steps { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .85rem; }
.steps .st { padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--fg-soft); font-weight: 600; }
.steps .st.done { background: var(--venta-bg); color: var(--venta); }
.steps .st.bad { background: var(--danger-bg); color: var(--danger); }
.checks { display: flex; gap: 14px; flex-wrap: wrap; font-size: .85rem; }
.rowactions { display: flex; gap: 6px; flex-wrap: wrap; }
.mailbox { border: 1px dashed var(--accent); border-radius: 12px; padding: 14px; display: grid; gap: 6px; background: var(--surface-2); }
.mailbox .code { font-family: var(--font-display); font-size: 2rem; letter-spacing: .25em; font-variant-numeric: tabular-nums; }
.bell-txt { display: none; }
.menu-btn { display: none; background: none; border: 1px solid rgba(255,255,255,.25); color: var(--brand-fg); border-radius: 8px; padding: 6px 10px; font-size: 1.1rem; cursor: pointer; }
.syncdot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: #8FD1A6; margin-right: 6px; vertical-align: middle; }
.syncdot.off { background: #E0A447; }
.installbar { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
@media (max-width: 720px) {
  .menu-btn { display: inline-flex; }
  .topbar .wrap { flex-wrap: wrap; }
  .nav { display: none; width: 100%; flex-direction: column; align-items: stretch; padding-bottom: 8px; }
  .nav.open { display: flex; }
  .nav a, .nav button.link { padding: 12px 10px; font-size: 1rem; text-align: left; }
  .bell-txt { display: inline !important; margin-left: 6px; }

<script>
/* SegundaMano Express — prototipo funcional (Sprints 1, 2 y 3)
 * HTML, CSS y JavaScript puro. Los datos se guardan en el navegador (localStorage)

 */
(function () {
  "use strict";

  const CITIES = ["Bogotá", "Medellín", "Cali", "Barranquilla", "Bucaramanga", "Chía", "Soacha", "Zipaquirá", "Mosquera", "Funza"];
  const CATS = ["Hogar", "Tecnología", "Deportes", "Ropa", "Libros", "Bebés", "Música"];
  const CAT_ICON = { Hogar: "🛋️", "Tecnología": "💻", Deportes: "🚲", Ropa: "🧥", Libros: "📚", "Bebés": "🍼", "Música": "🎸" };
  const CAT_TINT = { Hogar: "#E6D9C2", "Tecnología": "#D6DFE0", Deportes: "#D9E6D5", Ropa: "#E8D6D0", Libros: "#E3DCC8", "Bebés": "#EADFE6", "Música": "#DCD8E6" };
  const CONDS = ["Nuevo", "Usado - como nuevo", "Usado - buen estado", "Usado - con detalles"];
  const REASONS = ["Fraude o estafa", "Contenido inapropiado", "Artículo prohibido", "Información falsa", "Otro"];
  /* Detecta correos y teléfonos (10 dígitos o más) para proteger datos personales */
  const EMAIL_RE = /[^\s@]+@[^\s@]+\.[^\s@]{2,}/;
  const PHONE_RE = /(?:\+?\d[\s.-]?){10,}/;
  const hasContact = (t) => EMAIL_RE.test(t) || PHONE_RE.test(t);
  const maskContact = (t) => String(t).replace(new RegExp(EMAIL_RE.source, "g"), "[correo oculto]").replace(new RegExp(PHONE_RE.source, "g"), "[teléfono oculto] ");

  /* ---------- utilidades ---------- */
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const money = (n) => "$ " + Number(n).toLocaleString("es-CO");
  const hash = (s) => { let h = 5381; for (const ch of String(s)) h = ((h << 5) + h + ch.charCodeAt(0)) | 0; return "h" + (h >>> 0).toString(36); };
  const now = () => Date.now();
  const ago = (t) => {
    const m = Math.round((now() - t) / 60000);
    if (m < 1) return "hace un momento";

  const fdate = (t) => new Date(t).toLocaleDateString("es-CO", { day: "numeric", month: "short", year: "numeric" });
  const where = (p) => (p.zone ? `${p.zone}, ${p.city}` : p.city);

  /* ---------- "base de datos" ----------
   * Modo compartido: el servidor (server.js) guarda los datos y cada navegador envía solo lo que cambió.
   * Modo local: si no hay servidor, todo se guarda en este navegador (localStorage). */
  const COLLS = ["users", "posts", "questions", "convs", "requests", "txs", "deliveries", "reviews", "notifs", "reports", "orders"];

  let CONFIG = { googleClientId: null, payments: "pruebas", wompiSandbox: null, shippingFee: SHOP.SHIPPING_FEE };
  let serverMode = false, connected = false, version = 0, epoch = 0;
  let sess = (() => { try { return JSON.parse(localStorage.getItem(SKEY)) || {}; } catch (e) { return {}; } })();

  function norm(d) {
    COLLS.forEach((c) => (d[c] = d[c] || []));
    d.resets = d.resets || []; d.seq = d.seq || 100;
    d.users.forEach((u) => { u.favs = u.favs || []; u.cart = u.cart || []; });
    d.posts.forEach((p) => { if (!Array.isArray(p.imgs)) p.imgs = p.img ? [p.img] : []; delete p.img; });
    return d;
  }
  const seed = () => norm(window.SME_SEED(localHash));
  let memory = null;
  function loadLocal() {
    try { const raw = localStorage.getItem(KEY); if (raw) return norm(JSON.parse(raw)); } catch (e) { /* sin almacenamiento */ }
    return memory || seed();
  }
  let db = loadLocal();
  let shadow = {}, outbox = [], sending = false;
  function snapshot() { shadow = {}; COLLS.forEach((c) => db[c].forEach((r) => (shadow[c + ":" + r.id] = JSON.stringify(r)))); }
  function save() {
    memory = db;
    if (!serverMode) {
      try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { toast("El navegador se quedó sin espacio. Usa el servidor para guardar más fotos."); }
      return;
    }
    const up = {}; let n = 0;
    // Los pedidos solo los cambia el servidor (compras, pagos y estados)
    COLLS.filter((c) => c !== "orders").forEach((c) => db[c].forEach((r) => {
      const k = c + ":" + r.id, js = JSON.stringify(r);
      if (shadow[k] !== js) { (up[c] = up[c] || []).push(r); shadow[k] = js; n++; }
    }));
    if (n) { outbox.push(up); flush(); }
  }
  async function api(path, body) {
    const r = await fetch("api/" + path, {
      method: body === undefined ? "GET" : "POST", cache: "no-store",
      headers: { "Content-Type": "application/json", "X-Token": sess.token || "" },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    let j = {}; try { j = await r.json(); } catch (e) { /* respuesta vacía */ }
    if (!r.ok && !j.errors) { const err = new Error(j.error || "No pudimos conectar con el servidor."); err.status = r.status; throw err; }
    return j;
  }
  async function flush() {
    if (sending || !outbox.length) return;
    sending = true;
    const up = outbox.shift();
    try {
      const r = await api("sync", { upserts: up });
      setConnected(true);
      if (!outbox.length) { const how = mergeState(r); if (how) liveRefresh(how); }
    } catch (e) {
      if (e.status === 401 || e.status === 403) { setSession(null); toast(e.message); render(); }
      else { outbox.unshift(up); setConnected(false); setTimeout(() => { sending = false; flush(); }, 3000); return; }
    }
    sending = false;
    if (outbox.length) flush();
  }
  /* Fusiona el estado del servidor sobre los mismos objetos para no perder referencias abiertas en pantalla */
  function mergeState(r, force) {
    if (!r || !r.state) return false;
    if (r.epoch === epoch && !force && r.version < version) return false;
    if (r.epoch !== epoch || force) {
      epoch = r.epoch; version = r.version;
      db = norm(Object.assign({ seq: 100 }, r.state)); memory = db; snapshot();
      return "replace";
    }
    if (r.version === version) return false;
    version = r.version;

      const map = new Map(db[c].map((x) => [x.id, x]));
      r.state[c].forEach((rec) => {
        const cur = map.get(rec.id);
        if (cur) { Object.keys(cur).forEach((k) => { if (!(k in rec)) delete cur[k]; }); Object.assign(cur, rec); }

  }
  async function poll() {
    if (!serverMode || sending || outbox.length) return;

  function setConnected(v) {

  /* Cuentas: en modo compartido las valida el servidor; en modo local, este navegador (mismas reglas en core.js) */
  /* Después de iniciar o cerrar sesión se descarga el estado completo: cada persona solo recibe sus datos privados */
  async function refreshState() {
    if (!serverMode) return;

  }
  async function settle() {
    for (let i = 0; i < 60 && (sending || outbox.length); i++) await new Promise((r) => setTimeout(r, 100));
  }
  async function doRegister(v) {
    if (serverMode) {
      const r = await api("register", v);
      if (r.errors) return r;
      setSession(r.uid, r.token); mergeState(r, true);
      return { user: user(r.uid) };
    }
    const r = window.SME_CORE.register(db, v, localHash, nextId);
    if (r.user) { setSession(r.user.id); save(); }
    return r;
  }
  async function doLogin(email, pass) {
    if (serverMode) {
      try { const r = await api("login", { email, pass }); setSession(r.uid, r.token); await refreshState(); return { user: user(r.uid) }; }
      catch (e) { return { error: e.message }; }
    }
    const r = window.SME_CORE.login(db, email, pass, localVerify);
    if (r.user) setSession(r.user.id);
    return r;
  }
  async function doResetRequest(email) {
    if (serverMode) { try { return await api("reset/request", { email }); } catch (e) { return { error: e.message }; } }
    const r = window.SME_CORE.resetRequest(db, email); save(); return r;
  }
  async function doResetConfirm(v) {
    if (serverMode) { try { return await api("reset/confirm", v); } catch (e) { return { errors: { code: e.message } }; } }
    const r = window.SME_CORE.resetConfirm(db, v, localHash); save(); return r;
  }

    if (!serverMode) return dataUrl;
    const r = await api("upload", conv != null ? { data: dataUrl, conv } : { data: dataUrl });
    if (!r.url) throw new Error((r.errors && Object.values(r.errors)[0]) || "No pudimos subir la foto.");
    return r.url;
  }
  /* Compras: en el modo compartido las procesa el servidor; en modo local, este navegador con las mismas reglas (shop.js) */
  const shopCtx = { newId: () => nextId(), now: () => now() };
  async function shopCall(kind, a, b) {
    if (serverMode) {
      await settle();
      try {
        const r = kind === "create" ? await api("orders", a) : kind === "pay" ? await api(`checkout/${a}/pay`, { card: b }) : await api(`orders/${a}/status`, b);

      } catch (e) { if (e.status === 401) { setSession(null); render(); } if (e.status === 402) await refreshState(); return { error: e.message, declined: e.status === 402 }; }

  }

  const nextId = () => (serverMode ? Date.now() * 1000 + Math.floor(Math.random() * 1000) : ++db.seq);
  const user = (id) => db.users.find((u) => u.id === id);

  const role = () => (me() ? me().role : null);
  function notify(userId, text, link, kind = "otro", postId = null) {
    db.notifs.push({ id: nextId(), user: userId, kind, post: postId, text, link, read: false, at: now() });
  }
  /* Resumen agrupado de alertas sin leer: "Tienes 3 preguntas nuevas en …" (HUI-04 / HUI-08) */
  const KIND_TXT = {
    pregunta: ["pregunta nueva", "preguntas nuevas"], mensaje: ["mensaje nuevo", "mensajes nuevos"],
    respuesta: ["respuesta nueva", "respuestas nuevas"], solicitud: ["solicitud nueva", "solicitudes nuevas"],
    oferta: ["oferta nueva", "ofertas nuevas"], resena: ["aviso de reseña", "avisos de reseña"],
    entrega: ["novedad de entrega", "novedades de entrega"], venta: ["venta nueva", "ventas nuevas"], pedido: ["novedad de pedido", "novedades de pedido"],
  };
  function summaryHtml() {
    const u = me(); if (!u) return "";
    const groups = {};
    db.notifs.filter((n) => n.user === u.id && !n.read && KIND_TXT[n.kind] && n.post && post(n.post)).forEach((n) => {
      const k = n.kind + ":" + n.post; (groups[k] = groups[k] || { kind: n.kind, post: n.post, n: 0, link: n.link }).n++;

  }
  function rating(userId) {

  }
  const visiblePosts = () => db.posts.filter((p) => p.status === "activa" && !(user(p.owner) || {}).suspended);
  const firstName = (id) => (user(id) ? user(id).name.split(" ")[0] : "Usuario");

  const MAX_PHOTOS = 4;
  function compressImage(file, maxSide) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const im = new Image();
      im.onload = () => {
        const k = Math.min(1, maxSide / Math.max(im.naturalWidth, im.naturalHeight));
        const c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(im.naturalWidth * k)); c.height = Math.max(1, Math.round(im.naturalHeight * k));
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL("image/jpeg", 0.8));
      };
      im.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad")); };
      im.src = url;
    });
  }

    };
    drawPhotos();
    const addFiles = async (input) => {
      const files = Array.from(input.files || []); input.value = "";
      if (!files.length) return;
      setErr(f, "img", "");
      for (const file of files) {
        if (imgs.length + pending >= MAX_PHOTOS) { setErr(f, "img", `Puedes subir máximo ${MAX_PHOTOS} fotos.`); break; }
        if (!/^image\//.test(file.type) && !/\.(jpe?g|png|webp|heic|heif)$/i.test(file.name)) { setErr(f, "img", "El archivo debe ser una imagen (JPG, PNG, WEBP o foto de la cámara)."); continue; }
        if (file.size > 15 * 1024 * 1024) { setErr(f, "img", "La imagen pesa más de 15 MB. Elige una más liviana."); continue; }
        pending++; drawPhotos();
        try {
          const data = await compressImage(file, serverMode ? 1280 : 800);
          imgs.push(await uploadImage(data));
        } catch (err) {
          setErr(f, "img", err.message === "bad" ? "No pudimos leer esta imagen. Prueba con una foto JPG o PNG." : "No pudimos subir la foto. Revisa la conexión e intenta de nuevo.");
        }
        pending--; drawPhotos();
      }
    };
    $("#p-cam").addEventListener("change", (e) => addFiles(e.target));
    $("#p-img").addEventListener("change", (e) => addFiles(e.target));
    f.addEventListener("submit", (e) => {
      e.preventDefault();
      if (pending) return toast("Espera a que terminen de subir las fotos.");
      const v = { title: f.elements.title.value.trim(), desc: f.desc.value.trim(), cat: f.cat.value, cond: f.cond.value, price: f.price ? f.price.value.trim() : "", city: f.city.value, zone: f.zone.value.trim() };
      let ok = true;
      ok = setErr(f, "zone", v.zone.length < 3 ? "Escribe el barrio o localidad (ej.: Suba)." : "") && ok;
      ok = setErr(f, "title", v.title.length < 3 ? "Escribe un título de al menos 3 caracteres." : "") && ok;
      ok = setErr(f, "desc", v.desc.length < 10 ? "Describe el artículo en al menos 10 caracteres." : "") && ok;
      ok = setErr(f, "cat", !v.cat ? "Selecciona una categoría." : "") && ok;
      ok = setErr(f, "cond", !v.cond ? "Selecciona el estado del artículo." : "") && ok;
      if (mode === "venta") {
        let pe = "";
        if (!v.price) pe = "Escribe el precio.";
        else if (!/^\d+$/.test(v.price)) pe = "El precio solo puede tener números, sin letras, puntos ni signos.";
        else if (Number(v.price) <= 0) pe = "El precio debe ser mayor que 0.";
        ok = setErr(f, "price", pe) && ok;
        const sv = f.stock.value.trim();
        ok = setErr(f, "stock", !/^\d+$/.test(sv) ? "Escribe cuántas unidades tienes (solo números)." : Number(sv) < 1 || Number(sv) > 999 ? "Las unidades deben estar entre 1 y 999." : "") && ok;
      }
      if (!ok) { const bad = $(".field.bad", f); bad && bad.scrollIntoView({ block: "center", behavior: "smooth" }); return; }
      const data = { title: v.title, desc: v.desc, cat: v.cat, cond: v.cond, price: mode === "venta" ? Number(v.price) : 0, city: v.city, zone: v.zone, imgs: [...imgs] };
      if (mode === "venta") data.stock = Number(f.stock.value.trim());
      if (editing) {
        const oldPrice = editing.price;
        Object.assign(editing, data, { editedAt: now() });
        if (editing.status === "vendida" && editing.stock > 0) editing.status = "activa";
        // En el modo compartido el servidor avisa la baja de precio a quienes lo tienen en favoritos
        if (!serverMode && mode === "venta" && data.price < oldPrice) {
          db.users.filter((x) => x.id !== editing.owner && (x.favs || []).includes(editing.id)).forEach((x) => notify(x.id, `Bajó el precio de “${editing.title}” en tus favoritos: ahora ${money(data.price)}.`, `pub-${editing.id}`, "otro", editing.id));
        }
        save(); toast("Publicación actualizada");
        return go(`pub-${editing.id}`);
      }
      const p = Object.assign({ id: nextId(), owner: me().id, mode, status: "activa", at: now() }, data);
      db.posts.push(p); save();
      toast("Publicado. Ya aparece en el catálogo.");
      go(`pub-${p.id}`);
    });
  }

  /* ---------- HUI-09 reportar ---------- */
  function reportModal(type, target, label) {
    modal(`<form id="rep" class="form" novalidate>
      <h2>Reportar ${type === "post" ? "publicación" : "usuario"}</h2>
      <p class="muted small">${esc(label)}. Un administrador revisará el reporte.</p>
      <div class="field"><label for="rep-r">Motivo</label><select id="rep-r" name="reason" data-cy="motivo"><option value="">Selecciona…</option>${REASONS.map((r) => `<option>${r}</option>`).join("")}</select><span class="err"></span></div>
      <div class="field"><label for="rep-c">Descripción</label><textarea id="rep-c" name="comment" maxlength="400" data-cy="comentario-reporte" placeholder="Cuéntale al moderador qué pasó."></textarea><span class="err" data-cy="error-descripcion"></span></div>
      <div class="actions"><button class="btn danger" data-cy="enviar-reporte">Enviar reporte</button><button type="button" class="btn ghost" data-close>Cancelar</button></div>
    </form>`, (s, close) => {
      const f = $("#rep", s);
      f.addEventListener("submit", (e) => {
        e.preventDefault();
        let ok = setErr(f, "reason", f.reason.value ? "" : "Elige un motivo para el reporte.");
        ok = setErr(f, "comment", f.comment.value.trim().length < 10 ? "Agrega una descripción de al menos 10 caracteres." : "") && ok;
        if (!ok) return;
        if (db.reports.some((r) => r.reporter === me().id && r.type === type && r.target === target && r.status === "pendiente")) { close(); toast("Ya reportaste esto. Tu reporte sigue pendiente de revisión."); return; }
        db.reports.push({ id: nextId(), reporter: me().id, type, target, reason: f.reason.value, comment: f.comment.value.trim(), status: "pendiente", action: null, at: now() });
        db.users.filter((x) => x.admin).forEach((a) => notify(a.id, `Nuevo reporte (${f.reason.value}): ${label}.`, "admin", "reporte"));
        save(); close(); header();
        modal(`<div data-cy="reporte-confirmado" style="display:grid;gap:10px"><h2>✅ Reporte enviado</h2><p>Tu reporte por <b>${esc(f.reason.value)}</b> quedó en estado <span class="badge gray">Pendiente</span>. Un moderador lo revisará y te notificaremos la decisión.</p><button class="btn" data-close>Entendido</button></div>`);
      });
    });
  }

      <div class="pagehead"><div><h1>Mis publicaciones</h1><p class="muted">${mine.length} publicaciones · ${count("activa")} activas · ${count("pausada")} pausadas · ${count("reservada")} con entrega acordada.</p></div><a class="btn" href="#publicar" data-cy="nueva-publicacion">Publicar artículo</a></div>

        const reqs = db.requests.filter((r) => r.post === p.id);

        const dl = activeDelivery(p.id);
        return `<div class="row" data-cy="mi-publicacion">
          ${thumb(p, "thumb mini")}
          <div class="grow"><a href="#pub-${p.id}"><b>${esc(p.title)}</b></a>
            <span class="small muted">${badge(p)} ${modeLabel(p)} · ${esc(where(p))} · ${ago(p.at)}</span></div>
          ${statusBadge(p)}
          ${manageBtns(p)}
          ${p.status === "activa" && buyers.length ? `<select class="input" style="width:auto" data-agree="${p.id}" aria-label="Acordar entrega con" data-cy="acordar-entrega-con"><option value="">🤝 Acordar entrega con…</option>${buyers.map((b) => `<option value="${b}">${esc(user(b).name)}</option>`).join("")}</select>` : p.status === "activa" && !reqs.some((r) => r.status === "pendiente") ? `<span class="small muted">Sin interesados aún</span>` : ""}
          ${dl ? `<div style="flex-basis:100%">${deliveryHtml(dl, true)}</div>` : ""}
          ${reqs.length ? `<div style="flex-basis:100%;display:grid;gap:8px">${reqs.map((r) => `
            <div class="row" style="background:var(--bg)" data-cy="solicitud">
              <div class="grow"><b>${esc(user(r.requester).name)}</b><span class="small muted">solicitó esta donación ${ago(r.at)}</span></div>
              <span class="badge ${r.status === "aceptada" ? "venta" : r.status === "rechazada" ? "bad" : "gray"}" data-cy="estado">${r.status}</span>
              ${r.status === "pendiente" && p.status === "activa" ? `<button class="btn sm" data-acc="${r.id}" data-cy="aceptar">Aceptar</button><button class="btn ghost sm" data-rej="${r.id}" data-cy="rechazar">Rechazar</button>` : ""}
            </div>`).join("")}</div>` : ""}
        </div>`;
      }).join("") : `<div class="empty"><h3>Todavía no has publicado nada</h3><p class="muted">Publica tu primer artículo para venderlo o donarlo.</p></div>`}</div></div>`;
    const redraw = () => { viewMisPublicaciones(); header(); };
    $$("[data-acc]").forEach((b) => b.addEventListener("click", () => {
      const r = db.requests.find((x) => x.id === Number(b.dataset.acc)), p = post(r.post);
      agreeModal(p, [r.requester], () => {
        if (r.status === "aceptada") notify(r.requester, `${u.name} aceptó tu solicitud de “${p.title}”. Revisa el lugar y la fecha en Entregas.`, "entregas", "solicitud", p.id);
        save(); redraw();
      }, r);
    }));
    $$("[data-rej]").forEach((b) => b.addEventListener("click", () => {
      const r = db.requests.find((x) => x.id === Number(b.dataset.rej)), p = post(r.post);

      notify(r.requester, `${u.name} rechazó tu solicitud de “${p.title}”.`, "mis-solicitudes", "otro", p.id);
      save(); toast("Solicitud rechazada."); redraw();

      if (!sel.value) return;
      const p = post(Number(sel.dataset.agree)), buyer = Number(sel.value); sel.value = "";

  /* ---------- HUI-05 mis solicitudes (Donante/Comprador) ---------- */
  function viewMisSolicitudes() {
    if (!me()) return needLogin("mis-solicitudes");
    if (role() !== "C") return denied("Esta sección es del rol Comprador. Cámbialo en el selector de la parte superior o en tu perfil.");
    const u = me();
    const list = db.requests.filter((r) => r.requester === u.id).sort((a, b) => b.at - a.at);
    const asks = db.posts.filter((p) => p.owner === u.id && p.mode === "solicitud").sort((a, b) => b.at - a.at);
    main().innerHTML = `<div class="wrap page medium">
      <div class="pagehead"><div><h1>Mis solicitudes</h1><p class="muted">Artículos que pediste a la comunidad y donaciones que solicitaste.</p></div><a class="btn" href="#pedir" data-cy="nueva-solicitud">Pedir un artículo</a></div>
      <h2>Artículos que necesito</h2>
      <div class="list">${asks.length ? asks.map((p) => { const offers = db.convs.filter((c) => c.post === p.id); return `
        <div class="row" data-cy="mi-pedido">${thumb(p, "thumb mini")}
          <div class="grow"><a href="#pub-${p.id}"><b>${esc(p.title)}</b></a><span class="small muted">${badge(p)} ${esc(where(p))} · ${ago(p.at)} · ${offers.length} ${offers.length === 1 ? "oferta" : "ofertas"}</span></div>
          <span class="badge ${p.status === "activa" ? "solicitud" : "gray"}">${p.status}</span>
          ${p.status === "activa" ? (offers.length ? `<select class="input" style="width:auto" data-got="${p.id}" aria-label="Lo recibí de" data-cy="lo-recibi"><option value="">Lo recibí de…</option>${offers.map((c) => `<option value="${c.buyer}">${esc(user(c.buyer).name)}</option>`).join("")}</select>` : `<span class="small muted">Sin ofertas aún</span>`) : ""}
        </div>`; }).join("") : `<div class="empty"><h3>No has pedido artículos</h3><p class="muted">Publica lo que necesitas y la comunidad te lo puede ofrecer.</p></div>`}</div>
      <h2>Donaciones que solicité</h2>
      <div class="list">${list.length ? list.map((r) => { const p = post(r.post); return `
        <div class="row" data-cy="mi-solicitud">${thumb(p, "thumb mini")}
          <div class="grow"><a href="#pub-${p.id}"><b>${esc(p.title)}</b></a><span class="small muted">Donante: ${esc(user(p.owner).name)} · ${ago(r.at)}</span></div>
          <span class="badge ${r.status === "aceptada" ? "venta" : r.status === "rechazada" ? "bad" : "gray"}" data-cy="estado">${r.status}</span>
        </div>`; }).join("") : `<div class="empty"><h3>No has solicitado donaciones</h3><p class="muted">Filtra el catálogo por Donación y pide lo que necesites.</p><a class="btn ghost" href="#catalogo">Ver donaciones</a></div>`}</div></div>`;
    $$("[data-got]").forEach((s) => s.addEventListener("change", () => {
      if (!s.value) return;
      const p = post(Number(s.dataset.got)), giver = Number(s.value);
      p.status = "cerrada";
      db.txs.push({ id: nextId(), post: p.id, seller: giver, buyer: u.id, at: now() });
      notify(giver, `${u.name} confirmó que recibió tu donación para “${p.title}”. ¡Gracias!`, `perfil-${giver}`, "otro", p.id);
      save(); toast("Solicitud cerrada. Ya puedes calificar a quien te donó en Mis compras."); viewMisSolicitudes();
    }));

  /* ---------- HUI-07 transacciones y reseñas ---------- */
  function viewTransacciones() {
    if (!me()) return needLogin("transacciones");
    if (role() !== "C") return denied("Esta sección es del rol Comprador. Cámbialo en el selector de la parte superior o en tu perfil.");
    const u = me();
    const list = db.txs.filter((t) => t.buyer === u.id).sort((a, b) => b.at - a.at);
    main().innerHTML = `<div class="wrap page medium">
      <div><h1>Mis compras y donaciones recibidas</h1><p class="muted">Califica de 1 a 5 estrellas a quien te vendió o donó. Solo una reseña por transacción.</p></div>
      <div class="list">${list.length ? list.map((t) => {
        const p = post(t.post), rv = db.reviews.find((r) => r.tx === t.id);
        return `<div class="row" data-cy="transaccion">${thumb(p, "thumb mini")}
          <div class="grow"><b>${esc(p.title)}</b><span class="small muted">${modeLabel(p)} · ${esc(user(t.seller).name)} · entregado ${ago(t.at)}</span>
          ${rv ? `<span class="small"><span class="stars">${starsTxt(rv.stars)}</span> ${esc(rv.comment || "Sin comentario")}</span>` : ""}</div>
          ${rv ? `<span class="badge venta">Calificada</span><button class="btn ghost sm locked" disabled title="Solo se permite una reseña por transacción" data-cy="calificar-otra-vez">Ya calificaste</button>` : `<button class="btn accent sm" data-rate="${t.id}" data-cy="calificar">Calificar</button>`}
        </div>`;
      }).join("") : `<div class="empty"><h3>Aún no tienes transacciones</h3><p class="muted">Aparecen aquí cuando un vendedor marca la entrega o un donante acepta tu solicitud.</p></div>`}</div></div>`;
    $$("[data-rate]").forEach((b) => b.addEventListener("click", () => rateModal(db.txs.find((t) => t.id === Number(b.dataset.rate)))));
  }
  function rateModal(t, after) {
    const p = post(t.post), seller = user(t.seller);
    let stars = 0;
    modal(`<form id="rate" class="form" novalidate>
      <h2>Califica a ${esc(seller.name)}</h2><p class="muted small">Por “${esc(p.title)}”.</p>
      <div class="field"><span class="lbl">Calificación</span>
        <div class="starpick" role="radiogroup" aria-label="Estrellas">${[1, 2, 3, 4, 5].map((n) => `<button type="button" data-s="${n}" aria-label="${n} ${n === 1 ? "estrella" : "estrellas"}" data-cy="estrella-${n}">★</button>`).join("")}</div>
        <input type="hidden" name="stars"><span class="err" data-cy="error-estrellas"></span></div>
      <div class="field"><label for="rv-c">Comentario (opcional)</label><textarea id="rv-c" name="comment" maxlength="300" data-cy="comentario-resena" placeholder="¿Cómo fue la entrega? ¿El artículo era como se describía?"></textarea><span class="err"></span></div>
      <div class="actions"><button class="btn" data-cy="publicar-resena">Publicar reseña</button><button type="button" class="btn ghost" data-close>Cancelar</button></div>
    </form>`, (s, close) => {
      const f = $("#rate", s);
      $$("[data-s]", f).forEach((b) => b.addEventListener("click", () => {
        stars = Number(b.dataset.s); $$("[data-s]", f).forEach((x) => x.classList.toggle("on", Number(x.dataset.s) <= stars)); setErr(f, "stars", "");
      }));
      f.addEventListener("submit", (e) => {
        e.preventDefault();
        if (!setErr(f, "stars", stars < 1 || stars > 5 ? "Selecciona una calificación de 1 a 5 estrellas." : "")) return;
        if (db.reviews.some((r) => r.tx === t.id)) { close(); toast("Ya calificaste esta transacción."); return; }
        db.reviews.push({ id: nextId(), tx: t.id, from: me().id, to: t.seller, stars, comment: f.comment.value.trim(), at: now() });
        notify(t.seller, `${me().name} te calificó con ${stars} ${stars === 1 ? "estrella" : "estrellas"} por “${p.title}”.`, `perfil-${t.seller}`, "resena", p.id);
        save(); close(); toast("Reseña publicada en el perfil."); (after || viewTransacciones)();
      });
    });
  }

  /* ---------- perfil ---------- */
  function viewPerfil(id) {
    const p = user(id);
    if (!p || p.admin) { main().innerHTML = `<div class="wrap page"><div class="empty"><h2>Este perfil no existe</h2></div></div>`; return; }
    const rt = rating(p.id), revs = db.reviews.filter((r) => r.to === p.id).sort((a, b) => b.at - a.at);
    const posts = db.posts.filter((x) => x.owner === p.id && x.status === "activa");
    const self = me() && me().id === p.id;
    main().innerHTML = `<div class="wrap page">
      <div class="panel seller" style="flex-wrap:wrap">
        <span class="avatar" style="width:64px;height:64px;font-size:1.3rem">${initials(p.name)}</span>
        <div style="flex:1 1 220px"><h1 data-cy="perfil-nombre">${esc(p.name)}</h1>
          <p class="muted">📍 ${esc(p.city)} · Miembro desde ${new Date(p.since).toLocaleDateString("es-CO", { month: "long", year: "numeric" })}${p.suspended ? ' · <span class="badge bad">Suspendida</span>' : ""}</p></div>
        <div style="text-align:right"><div class="price num" data-cy="promedio">${rt.n ? rt.avg.toFixed(1) : "—"}</div><span class="stars">${rt.n ? starsTxt(rt.avg) : ""}</span><div class="small muted">${rt.n} ${rt.n === 1 ? "reseña" : "reseñas"}</div></div>
        ${me() && !self && !me().admin ? `<button class="btn ghost sm" id="rep-user" data-cy="reportar-usuario">Reportar usuario</button>` : ""}
      </div>
      ${self ? (() => {
        const hist = { pubs: db.posts.filter((x) => x.owner === p.id).length, compras: db.txs.filter((t) => t.buyer === p.id).length, ventas: db.txs.filter((t) => t.seller === p.id).length, resenas: db.reviews.filter((r) => r.from === p.id || r.to === p.id).length, chats: db.convs.filter((c) => c.buyer === p.id || c.seller === p.id).length };
        return `<section class="panel" style="display:grid;gap:14px" data-cy="configuracion">
        <div><h2>Configuración de la cuenta</h2><p class="muted small">Correo: ${esc(p.email)}${p.phone ? ` · Teléfono: ${esc(p.phone)}` : ""} (privados: otros usuarios no los ven)</p></div>
        <div class="field"><span class="lbl">Rol activo (modo de uso)</span>
          <div class="roles" data-cy="roles-perfil">${["C", "V", "D"].map((k) => `<button type="button" class="rolecard ${p.role === k ? "on" : ""}" data-prole="${k}" data-cy="perfil-rol-${k}"><b>${{ C: "🛒", V: "🏷️", D: "🎁" }[k]} ${ROLES[k]}${p.role === k ? " · activo" : ""}</b><span class="small muted">${ROLE_DESC[k]}</span></button>`).join("")}</div></div>
        <p class="small muted" data-cy="historial">Tu historial se conserva al cambiar de rol: ${hist.pubs} publicaciones, ${hist.compras} compras o donaciones recibidas, ${hist.ventas} entregas, ${hist.resenas} reseñas, ${hist.chats} conversaciones y ${db.orders.filter((o) => o.buyer === p.id).length} pedidos.</p>
      </section>
      <section class="panel" style="display:grid;gap:12px" data-cy="seguridad">
        <h2>Seguridad e inicio de sesión</h2>
        <div class="row" style="background:var(--bg)"><div class="grow"><b>Contraseña</b><span class="small muted" data-cy="estado-clave">${p.hasPass === false ? "Tu cuenta no tiene contraseña: entras con Google." : "Configurada. Mínimo 8 caracteres con letras y números."}</span></div><a class="btn ghost sm" href="#recuperar" data-cy="cambiar-clave">${p.hasPass === false ? "Crear contraseña" : "Cambiar contraseña"}</a></div>
        ${serverMode && CONFIG.googleClientId ? `<div class="row" style="background:var(--bg)"><div class="grow"><b>Cuenta de Google</b><span class="small muted" data-cy="estado-google">${p.google ? `Vinculada: ${esc(p.googleEmail || p.email)}. Puedes entrar con “Continuar con Google”.` : "Sin vincular. Vincúlala para entrar con un clic."}</span></div>
          ${p.google ? `<button class="btn ghost sm" id="g-unlink" data-cy="desvincular-google">Desvincular</button>` : `<div class="gsi" id="gsi-link" data-cy="vincular-google"></div>`}</div>` : ""}
        <p class="small muted">Tu sesión se cierra sola a los 7 días, al cambiar la contraseña o al pulsar <b>Salir</b>. Después de 5 intentos fallidos bloqueamos el inicio de sesión por 15 minutos.</p>
      </section>`; })() : ""}
      <section class="grid2" style="align-items:start">
        <div class="panel" style="display:grid;gap:12px"><h2>Reseñas recibidas</h2>${revs.length ? revs.map((r) => `<div class="q" data-cy="resena"><span class="stars">${starsTxt(r.stars)}</span><p>${esc(r.comment || "Sin comentario")}</p><span class="small muted">${esc(user(r.from).name)} · ${fdate(r.at)}</span></div>`).join("") : `<p class="muted">Sin reseñas todavía.</p>`}</div>
        <div class="panel" style="display:grid;gap:12px"><h2>Publicaciones activas</h2>${posts.length ? posts.map((x) => `<a class="row" href="#pub-${x.id}" style="text-decoration:none">${thumb(x, "thumb mini")}<div class="grow"><b>${esc(x.title)}</b><span class="small muted">${badge(x)} ${x.mode === "venta" ? money(x.price) : x.mode === "solicitud" ? "Se necesita" : "Gratis"}</span></div></a>`).join("") : `<p class="muted">No tiene publicaciones activas.</p>`}</div>
      </section></div>`;
    const r = $("#rep-user"); r && r.addEventListener("click", () => reportModal("user", p.id, p.name));

        try { const r2 = await api("auth/google/link", { credential: cred }); mergeState(r2, true); toast("Cuenta de Google vinculada."); viewPerfil(id); }
        catch (e) { toast(e.message); }
      });
      const gu = $("#g-unlink");
      gu && gu.addEventListener("click", async () => {
        try { const r2 = await api("auth/google/unlink", {}); mergeState(r2, true); toast("Desvinculaste tu cuenta de Google."); viewPerfil(id); }
        catch (e) { toast(e.message); }
      });
    }
    $$("[data-prole]").forEach((b) => b.addEventListener("click", () => {
      const k = b.dataset.prole; if (k === p.role) return;
      p.role = k; save();
      toast(`Rol actualizado a ${ROLES[k]}. Tus permisos cambiaron y tu historial se conserva.`);
      viewPerfil(id); header();
    }));
  }

  /* ---------- HUI-04 mensajes ---------- */
  function viewMensajes() {
    if (!me()) return needLogin("mensajes");
    if (me().admin) return denied("El administrador no participa en las conversaciones entre usuarios.");
    const u = me();
    const list = db.convs.filter((c) => c.buyer === u.id || c.seller === u.id)
      .sort((a, b) => (b.msgs.at(-1)?.at || 0) - (a.msgs.at(-1)?.at || 0));
    main().innerHTML = `<div class="wrap page medium"><div><h1>Mensajes</h1><p class="muted">Coordina la fecha, el lugar y el pago de cada entrega.</p></div>
      <div class="list">${list.length ? list.map((c) => { const p = post(c.post), other = user(c.buyer === u.id ? c.seller : c.buyer), last = c.msgs.at(-1); return `
        <a class="row" href="#chat-${c.id}" style="text-decoration:none" data-cy="conversacion">${thumb(p, "thumb mini")}
          <div class="grow"><b>${esc(other.name)}</b><span class="small muted">${badge(p)} ${esc(p.title)}</span><span class="small">${last ? esc(showMsg(c, last)) : "Sin mensajes todavía"}</span></div>
          <span class="small muted">${last ? ago(last.at) : ""}</span></a>`; }).join("") : `<div class="empty"><h3>No tienes conversaciones</h3><p class="muted">Abre una publicación y pulsa Contactar.</p></div>`}</div></div>`;
  }
  /* Los correos y teléfonos escritos en el chat se ocultan hasta que su autor comparta sus datos explícitamente */
  function showMsg(c, m) {
    if (m.from === 0 || m.contact || m.type) return m.text;
    return (c.shared || {})[m.from] ? m.text : maskContact(m.text);
  }
  function viewChat(id) {
    const c = db.convs.find((x) => x.id === id), u = me();
    if (!u) return needLogin(`chat-${id}`);
    if (!c || (c.buyer !== u.id && c.seller !== u.id)) return denied("Solo los participantes pueden ver esta conversación.");
    c.shared = c.shared || {};
    const p = post(c.post), other = user(c.buyer === u.id ? c.seller : c.buyer);
    const closed = p.status === "oculta" || p.status === "eliminada";
    const dlast = db.deliveries.filter((d) => d.post === p.id && d.buyer === c.buyer).sort((a, b) => b.at - a.at)[0];
    const canAgree = p.mode !== "solicitud" && u.id === p.owner && p.status === "activa";
    const iShared = !!c.shared[u.id], otherShared = !!c.shared[other.id];
    const roleIn = (id) => id === c.seller ? (p.mode === "venta" ? "Vendedor" : p.mode === "donacion" ? "Donante" : "Solicitante") : (p.mode === "venta" ? "Comprador" : p.mode === "donacion" ? "Interesado" : "Ofrece el artículo");
    const ord = db.orders.filter((o) => o.buyer === c.buyer && o.seller === c.seller && o.items.some((it) => it.post === c.post) && o.status !== "cancelado").sort((a, b) => b.at - a.at)[0];
    main().innerHTML = `<div class="wrap page medium">
      <a href="#mensajes" class="small muted">← Todas las conversaciones</a>
      ${dlast ? deliveryHtml(dlast) : ""}
      ${canAgree ? `<div class="alert installbar" data-cy="aviso-acordar"><span>¿Ya acordaron fecha y lugar con ${esc(other.name.split(" ")[0])}? Regístralo para reservar el artículo.</span><button class="btn sm" id="agree-btn" data-cy="acordar-entrega">🤝 Acordar entrega</button></div>` : ""}
      <div class="chatbox" style="grid-template-rows:auto ${ord ? "auto " : ""}auto minmax(260px, 50vh) auto">
        <div class="chathead"><span class="avatar">${initials(other.name)}</span>
          <div class="grow" style="flex:1;min-width:0"><b>${esc(other.name)}</b> <span class="badge gray" data-cy="rol-otro">${roleIn(other.id)}</span><div class="small muted">Chat de la publicación <a href="#pub-${p.id}" data-cy="chat-publicacion">${esc(p.title)}</a> · ${badge(p)} ${modeLabel(p)}</div>
          <div class="chatroles small muted" data-cy="roles-chat">${roleIn(c.seller)}: <b>${esc(user(c.seller).name)}</b> · ${roleIn(c.buyer)}: <b>${esc(user(c.buyer).name)}</b></div></div></div>
        ${ord ? `<div class="contactbox orderbar" data-cy="pedido-chat"><span>🧾 Pedido ${esc(ord.code)} · <b>${SHOP.STATUS_TXT[ord.status]}</b> · ${money(ord.total)}</span><a class="small" href="#${ord.buyer === u.id ? "mis-pedidos" : "mis-ventas"}">Ver pedido →</a></div>` : ""}
        <div class="contactbox" data-cy="privacidad">
          <span>🔒 Datos de ${esc(other.name.split(" ")[0])}: ${otherShared ? `<b data-cy="contacto-otro">${esc(other.email)}${other.phone ? " · " + esc(other.phone) : ""}</b>` : `<span data-cy="contacto-oculto">correo y teléfono ocultos</span>`}</span>

  function cartCount() { const u = me(); return u ? (u.cart || []).reduce((a, c) => a + (c.qty || 0), 0) : 0; }
  function addToCart(pid, qty) {
    const u = me(), p = post(pid);
    if (!u) { pendingCart = { pid, qty }; needLogin(`pub-${pid}`); return false; }
    if (u.admin) { toast("La cuenta de administración no hace compras."); return false; }
    if (!p || p.mode !== "venta" || p.status !== "activa") { toast("Este artículo no está disponible."); return false; }

    const st = SHOP.stockOf(p);
    u.cart = u.cart || [];
    const it = u.cart.find((c) => c.post === pid);
    const want = (it ? it.qty : 0) + qty, q = Math.min(want, st);
    if (it) it.qty = q; else u.cart.push({ post: pid, qty: q });
    save(); header();
    toast(want > st ? `Solo hay ${st} ${st === 1 ? "unidad" : "unidades"}: dejamos ${q} en tu carrito.` : `Agregado al carrito (${q} ${q === 1 ? "unidad" : "unidades"}).`);
    return true;
  }
  function cartLines(list) {
    const u = me();
    return (list || []).map((c) => {
      const p = post(c.post); let ok = true, msg = "", qty = c.qty;
      const st = p ? SHOP.stockOf(p) : 0;
      if (!p || p.status === "eliminada") { ok = false; msg = "Este artículo ya no existe."; }
      else if (u && p.owner === u.id) { ok = false; msg = "Es tu propia publicación."; }
